# Private restoration of the Academy snapshot; no published ports or app workers.
name: academy-stage
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [database]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d figma_academy]
      interval: 5s
      timeout: 4s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api:
    image: rescue-giovsoft-api-00039-drx:saved
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    networks: [database]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  database: {internal: true}
volumes:
  database:
