# No mutating requests through the private preview.
server {
  listen 80;
  access_log off;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location / { proxy_pass http://school:8080; }
}
server {
  listen 81;
  access_log off;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location / { proxy_pass http://commerce:8080; }
}
server {
  listen 82;
  access_log off;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location / { proxy_pass http://payments:4000; }
}
