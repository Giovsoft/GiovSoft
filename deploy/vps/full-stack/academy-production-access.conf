server {
    listen 80;
    server_name _;
    access_log off;
    # Preserve histories, but do not silently replace Vertex with development AI.
    location = /api/learn/status {
        default_type application/json;
        return 503 '{"error":"El tutor IA está temporalmente no disponible."}';
    }
    location = /api/learn/tutor {
        default_type application/json;
        return 503 '{"error":"El tutor IA está temporalmente no disponible."}';
    }
    location = /api/learn/submissions {
        if ($request_method = POST) { return 503; }
        proxy_pass http://api:8080;
    }
    location = /api { proxy_pass http://api:8080; }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://api:8080;
    }
    location / {
        proxy_set_header Host $host;
        proxy_pass http://web:8080;
    }
}
