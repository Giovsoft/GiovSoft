include /etc/nginx/colegio-gate.conf;
server {
  listen 80;
  server_tokens off;
  access_log off;
  client_max_body_size 15m;
  if ($colegio_request_allowed = 0) { return 405; }

  # Single data backend: no writes to independent restored accounts on the VPS.
  location ~ ^/(api|uploads)(/|$) {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $colegio_cloud_origin colegio-iberoamericano-598441636410.us-central1.run.app;
    proxy_pass https://$colegio_cloud_origin;
    proxy_set_header Host $colegio_cloud_origin;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name $colegio_cloud_origin;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://web:8080;
    proxy_set_header Host $http_host;
  }
}
