name: colegio-vps-preview

services:
  school:
    image: ${COLEGIO_IMAGE:-colegio-vps:9c867b6}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: "8080"
      ADMIN_PASSWORD: ${COLEGIO_PREVIEW_ADMIN_PASSWORD:?Generate private preview.env first}
      GCS_BUCKET: ""
      SMTP_HOST: ""
      SUPPORT_SMTP_HOST: ""
      GIOVCOMMERCE_API_URL: http://127.0.0.1:9
      GIOVCOMMERCE_STOREFRONT_SECRET: ""
      GIOVCOMMERCE_STORE_DOMAIN: colegioiberoamericano.com.mx
      PUBLIC_URL: http://127.0.0.1:${COLEGIO_PREVIEW_PORT:-8082}
    volumes:
      - type: bind
        source: ${COLEGIO_RESTORED_DIR:-/opt/colegio/restauracion-inicial}/data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COLEGIO_RESTORED_DIR:-/opt/colegio/restauracion-inicial}/uploads
        target: /app/public/uploads
        read_only: true
        bind:
          create_host_path: false
    networks: [isolated]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health', {signal: AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  access:
    image: nginx:stable-alpine
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports:
      - "127.0.0.1:${COLEGIO_PREVIEW_PORT:-8082}:80"
    volumes:
      - ./colegio-preview.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, access]
    depends_on:
      school:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  isolated:
    internal: true
  access:
