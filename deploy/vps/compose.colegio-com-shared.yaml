# .com frontend on VPS; ALL mutable data stays behind the existing Cloud Run API.
name: colegio-com-shared
services:
  web:
    image: ${COLEGIO_IMAGE:-colegio-vps:9c867b6}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: "8080"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Use the existing private configuration}
      GCS_BUCKET: ""
      SMTP_HOST: ""
      SUPPORT_SMTP_HOST: ""
      GIOVCOMMERCE_API_URL: http://127.0.0.1:9
      GIOVCOMMERCE_STOREFRONT_SECRET: ""
      PUBLIC_URL: https://colegioiberoamericano.com
    networks: [static]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health', {signal: AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  access:
    image: nginx:stable-alpine
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports:
      - "127.0.0.1:${COLEGIO_SHARED_CHECK_PORT:-8085}:80"
    volumes:
      - ./colegio-com-shared.conf:/etc/nginx/conf.d/default.conf:ro
      - ${COLEGIO_SHARED_GATE:-./colegio-shared-readonly.conf}:/etc/nginx/colegio-gate.conf:ro
    networks:
      static:
      edge:
        aliases: [colegio-public]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  static:
    internal: true
  edge:
    external: true
    name: ${COLEGIO_EDGE_NETWORK:-giovsoft-vps_app}
