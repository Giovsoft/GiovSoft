server {
  listen 80;
  server_tokens off;
  access_log off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Colegio-Preview "production-check-read-only" always;
  sub_filter '</body>' '<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#42116b;color:white;text-align:center;padding:10px;font:700 14px sans-serif">COMPROBACIÓN PRIVADA · Catálogo conectado · Escrituras y pagos bloqueados</div></body>';
  sub_filter_once on;

  location = /api/store/auth/login {
    if ($request_method != POST) { return 405; }
    proxy_pass http://school:8080;
    proxy_set_header Host $http_host;
  }

  # Order reads can trigger reconciliation in upstream systems. Defer them.
  location ~ ^/api/store/(orders|customer-orders)(/|$) {
    default_type application/json;
    return 503 '{"ok":false,"message":"Pedidos desactivados hasta completar el corte."}';
  }

  location / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://school:8080;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
  }
}
