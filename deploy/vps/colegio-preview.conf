server {
  listen 80;
  server_tokens off;
  # Avoid storing login identifiers, session tokens or query strings in logs.
  access_log off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Colegio-Preview "read-only" always;
  sub_filter '</body>' '<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#42116b;color:white;text-align:center;padding:10px;font:700 14px sans-serif">VISTA PREVIA PRIVADA · Solo lectura · Correo y pagos desconectados</div></body>';
  sub_filter_once on;

  location = /api/store/auth/login {
    if ($request_method != POST) { return 405; }
    proxy_pass http://school:8080;
    proxy_set_header Host $http_host;
  }

  # These routes require Commerce and must not accidentally be treated as tested.
  location ~ ^/api/store/(catalog|products|orders|customer-orders)(/|$) {
    default_type application/json;
    return 503 '{"ok":false,"message":"Commerce desconectado en la vista previa privada."}';
  }

  location / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://school:8080;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
  }
}
