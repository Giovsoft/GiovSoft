name: giovsoft-stripe-sandbox
x-common: &common
  restart: unless-stopped
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 4s
    retries: 5
    start_period: 15s
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  seed:
    image: node:22-alpine
    command: [node, /sandbox/seed.cjs]
    environment:
      SANDBOX_MODE: "true"
      SANDBOX_APP_KEY: ${SANDBOX_APP_KEY:?Generate sandbox env}
      SANDBOX_WEBHOOK_KEY: ${SANDBOX_WEBHOOK_KEY:?Generate sandbox env}
      STRIPE_TEST_CONNECTED_ACCOUNT: ${STRIPE_TEST_CONNECTED_ACCOUNT:-}
    volumes:
      - ./seed.cjs:/sandbox/seed.cjs:ro
      - sandbox-hub:/seed/hub
      - sandbox-commerce:/seed/commerce
    network_mode: none

  hub:
    <<: *common
    build: { context: ../../backend }
    environment:
      NODE_ENV: test
      NODE_OPTIONS: --require=/sandbox/guard.cjs
      SANDBOX_MODE: "true"
      SANDBOX_SERVICE: hub
      PORT: "4000"
      FRONTEND_ORIGIN: http://127.0.0.1:${SCHOOL_PORT:-7410},http://127.0.0.1:${COMMERCE_PORT:-7411}
      ADMIN_EMAIL: sandbox@example.test
      ADMIN_NAME: Sandbox
      ADMIN_PASSWORD: ${SANDBOX_ADMIN_PASSWORD:?Generate sandbox env}
      ADMIN_TOKEN_SECRET: ${SANDBOX_HUB_KEY:?Generate sandbox env}
      ADMIN_2FA_ENABLED: "true"
      STRIPE_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      SANDBOX_STRIPE_ACCOUNT: ${STRIPE_TEST_CONNECTED_ACCOUNT:-}
      STRIPE_APPLICATION_FEE_PERCENT: "5"
    volumes:
      - ./guard.cjs:/sandbox/guard.cjs:ro
      - sandbox-hub:/app/data
    ports: ["127.0.0.1:${HUB_PORT:-7412}:4000"]
    depends_on: { seed: { condition: service_completed_successfully } }
    networks: [sandbox, stripe-egress]

  commerce:
    <<: *common
    build: { context: ../../../commerce-sandbox-source }
    environment:
      NODE_ENV: test
      NODE_OPTIONS: --require=/sandbox/guard.cjs
      SANDBOX_MODE: "true"
      SANDBOX_SERVICE: commerce
      PORT: "8080"
      COMMERCE_DATA_FILE: /app/data/commerce.json
      COMMERCE_ADMIN_EMAIL: sandbox@example.test
      COMMERCE_ADMIN_PASSWORD: ${SANDBOX_ADMIN_PASSWORD:?Generate sandbox env}
      GIOVSOFT_API_URL: http://hub:4000
      GIOVSOFT_APPLICATION_ID: 9d987c20-d821-43db-b11b-7cb523416000
      GIOVSOFT_APPLICATION_KEY: ${SANDBOX_APP_KEY:?Generate sandbox env}
      GIOVSOFT_WEBHOOK_SECRET: ${SANDBOX_WEBHOOK_KEY:?Generate sandbox env}
      GIOVSOFT_HUB_SECRET: ${SANDBOX_HUB_KEY:?Generate sandbox env}
      STOREFRONT_API_SECRET: ${SANDBOX_STOREFRONT_KEY:?Generate sandbox env}
      FRONTEND_ORIGIN: http://127.0.0.1:${COMMERCE_PORT:-7411}
      PASSKEYS_REQUIRED: "false"
      WEBAUTHN_RP_ID: 127.0.0.1
      WEBAUTHN_ORIGIN: http://127.0.0.1:${COMMERCE_PORT:-7411}
    volumes:
      - ./guard.cjs:/sandbox/guard.cjs:ro
      - sandbox-commerce:/app/data
    depends_on: { seed: { condition: service_completed_successfully } }
    networks: [sandbox]

  school:
    <<: *common
    build: { context: ../../../colegio-sandbox-source }
    environment:
      NODE_ENV: test
      NODE_OPTIONS: --require=/sandbox/guard.cjs
      SANDBOX_MODE: "true"
      SANDBOX_SERVICE: school
      PORT: "8080"
      ADMIN_PASSWORD: ${SANDBOX_ADMIN_PASSWORD:?Generate sandbox env}
      GIOVCOMMERCE_API_URL: http://commerce:8080
      GIOVCOMMERCE_STORE_DOMAIN: colegioiberoamericano.com.mx
      GIOVCOMMERCE_STOREFRONT_SECRET: ${SANDBOX_STOREFRONT_KEY:?Generate sandbox env}
      PUBLIC_URL: http://127.0.0.1:${SCHOOL_PORT:-7410}
    volumes:
      - ./guard.cjs:/sandbox/guard.cjs:ro
      - sandbox-school:/app/data
    depends_on: [commerce]
    networks: [sandbox]

  stripe-listener:
    image: stripe/stripe-cli@sha256:6fe7ec012be11a59e7749600c452dc7b9a5a3364d3983d50b1830d63ad15b535
    profiles: [stripe]
    environment:
      STRIPE_API_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_DEVICE_NAME: giovsoft-colegio-local-sandbox
    entrypoint: [/bin/sh, /sandbox/stripe-entrypoint.sh]
    command: [listen, --forward-to, "http://hub:4000/api/webhooks/stripe", --forward-connect-to, "http://hub:4000/api/webhooks/stripe"]
    volumes:
      - ./stripe-entrypoint.sh:/sandbox/stripe-entrypoint.sh:ro
    networks: [sandbox, stripe-egress]

  local-access:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./local-access.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SCHOOL_PORT:-7410}:8080"
      - "127.0.0.1:${COMMERCE_PORT:-7411}:8081"
    depends_on: [school, commerce]
    networks: [sandbox, stripe-egress]

networks:
  sandbox: { internal: true }
  stripe-egress: {}
volumes:
  sandbox-hub: {}
  sandbox-commerce: {}
  sandbox-school: {}
