server {
  listen 8080;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Sandbox "giovsoft-colegio-local" always;
  sub_filter '</body>' '<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#42116b;color:white;text-align:center;padding:10px;font:700 14px sans-serif">SANDBOX LOCAL · Datos ficticios · Solo Stripe de prueba · Sin cargos reales</div></body>';
  sub_filter_once on;
  location / {
    proxy_pass http://school:8080;
    proxy_set_header Host $http_host;
  }
}
