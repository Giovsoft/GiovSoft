server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.giovsoft.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' blob: https://gesove.com https://www.google.com https://www.google.com.mx; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me; upgrade-insecure-requests" always;

  if ($host = www.giovsoft.com) {
    return 301 https://giovsoft.com$request_uri;
  }

  location = / {
    try_files /index.html =404;
  }

  location ~ ^/(nosotros|contacto|academy|cookies|aviso-legal|privacidad|terminos|portafolio|software|aplicaciones)/?$ {
    try_files /index.html =404;
  }

  location ~ ^/portafolio/(software|aplicaciones|sitios-web|ecommerce)/?$ {
    try_files /index.html =404;
  }

  location ~ ^/servicios/[a-z0-9-]+/?$ {
    try_files /index.html =404;
  }

  location ~ ^/(admin|login)(/.*)?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 =404 /index.html;

}
